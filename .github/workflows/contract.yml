name: contract

on:
  push:
    branches: [main, develop]
    paths: ['contracts/**', '.github/workflows/contract.yml']
  pull_request:
    paths: ['contracts/**', '.github/workflows/contract.yml']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx @redocly/cli@latest lint contracts/openapi.yaml

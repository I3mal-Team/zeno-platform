openapi: 3.1.0

info:
  title: zeno API
  version: 1.0.0
  description: |
    Contract between the backend and the Flutter app.

    Every response uses one envelope. Clients branch on `error.code`, never on
    `message`: the message is server-owned copy and can be reworded freely.

servers:
  - url: https://api.zeno.sa/api/v1
    description: Production
  - url: https://staging.zeno.sa/api/v1
    description: Staging
  - url: http://localhost:8000/api/v1
    description: Local

tags:
  - name: Auth
  - name: Catalog

security:
  - bearerAuth: []

paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send a verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: >
                    Any Saudi mobile shape. 0512345678, 512345678,
                    +966512345678 and 00966512345678 all normalise to the same
                    stored value, as do Arabic-Indic digits.
                  examples: ['0512345678']
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expires_in_seconds: { type: integer, examples: [300] }
        '403':
          description: ACCOUNT_SUSPENDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: |
            OTP_RESEND_COOLDOWN carries `retry_after_seconds` in details so the
            client can render a countdown. OTP_MAX_ATTEMPTS means the hourly cap
            for that number is spent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify a code and open a session
      description: >
        Creates the account when the number is new. The role is only applied at
        that point; it is ignored for an existing account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, role]
              properties:
                phone: { type: string, examples: ['0512345678'] }
                code: { type: string, pattern: '^\d{4}$', examples: ['4829'] }
                role: { $ref: '#/components/schemas/UserRole' }
                device_name: { type: string, maxLength: 80, examples: ['iPhone 15'] }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          is_new_user: { type: boolean }
                          user: { $ref: '#/components/schemas/User' }
        '422':
          description: OTP_INVALID, OTP_EXPIRED or VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: OTP_MAX_ATTEMPTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401':
          description: SESSION_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every token for this user
      responses:
        '200':
          description: Signed out everywhere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /categories:
    get:
      tags: [Catalog]
      summary: Job categories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: [string, 'null'] }
        data: {}
        meta:
          type: object
          properties:
            pagination: { $ref: '#/components/schemas/Pagination' }

    ErrorEnvelope:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, const: false }
        message:
          type: string
          description: Arabic copy, ready to display. Never branch on this.
        error:
          type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            details:
              type: object
              description: >
                Field errors for VALIDATION_FAILED, or extra context such as
                retry_after_seconds.
            trace_id: { type: [string, 'null'] }

    ErrorCode:
      type: string
      description: Stable identifier. This is the contract, not the message.
      enum:
        - UNKNOWN_ERROR
        - VALIDATION_FAILED
        - NOT_FOUND
        - FORBIDDEN
        - RATE_LIMITED
        - SESSION_EXPIRED
        - FORCE_UPDATE
        - MAINTENANCE_MODE
        - ACCOUNT_SUSPENDED
        - PHONE_INVALID
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_MAX_ATTEMPTS
        - OTP_RESEND_COOLDOWN
        - JOB_NOT_ACTIVE
        - APPLICATION_ALREADY_EXISTS
        - APPLICATION_ALREADY_DECIDED
        - VACANCIES_EXHAUSTED
        - SUBSCRIPTION_REQUIRED
        - ORGANIZATION_NOT_VERIFIED
        - ORGANIZATION_MISSING
        - CONVERSATION_NOT_ALLOWED

    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: [integer, 'null'] }
        last_page: { type: [integer, 'null'] }
        has_more: { type: boolean }

    UserRole:
      type: string
      enum: [candidate, employer]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, examples: ['0512345678'] }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { type: string, enum: [active, suspended, deleted] }
        phone_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    Category:
      type: object
      properties:
        code:
          type: string
          enum:
            - restaurants
            - cleaning
            - logistics
            - events
            - retail
            - security
            - operations
            - crafts
            - seasonal_work
            - other
        name: { type: string, examples: ['مطاعم ومقاهي'] }
        icon: { type: string }
        color_token: { type: string }

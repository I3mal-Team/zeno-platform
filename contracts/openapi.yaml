openapi: 3.1.0

info:
  title: zeno API
  version: 1.0.0
  description: |
    Contract between the backend and the Flutter app.

    Every response uses one envelope. Clients branch on `error.code`, never on
    `message`: the message is server-owned copy and can be reworded freely.

servers:
  - url: https://api.zeno.sa/api/v1
    description: Production
  - url: https://staging.zeno.sa/api/v1
    description: Staging
  - url: http://localhost:8000/api/v1
    description: Local

tags:
  - name: Auth
  - name: Profile
  - name: Catalog
  - name: Jobs
  - name: Employer

security:
  - bearerAuth: []

paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send a verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: >
                    Any Saudi mobile shape. 0512345678, 512345678,
                    +966512345678 and 00966512345678 all normalise to the same
                    stored value, as do Arabic-Indic digits.
                  examples: ['0512345678']
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expires_in_seconds: { type: integer, examples: [300] }
        '403':
          description: ACCOUNT_SUSPENDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: |
            OTP_RESEND_COOLDOWN carries `retry_after_seconds` in details so the
            client can render a countdown. OTP_MAX_ATTEMPTS means the hourly cap
            for that number is spent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify a code and open a session
      description: >
        Creates the account when the number is new. The role is only applied at
        that point; it is ignored for an existing account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, role]
              properties:
                phone: { type: string, examples: ['0512345678'] }
                code: { type: string, pattern: '^\d{4}$', examples: ['4829'] }
                role: { $ref: '#/components/schemas/UserRole' }
                device_name: { type: string, maxLength: 80, examples: ['iPhone 15'] }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          is_new_user: { type: boolean }
                          user: { $ref: '#/components/schemas/User' }
        '422':
          description: OTP_INVALID, OTP_EXPIRED or VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: OTP_MAX_ATTEMPTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401':
          description: SESSION_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every token for this user
      responses:
        '200':
          description: Signed out everywhere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /profile/candidate:
    get:
      tags: [Profile]
      summary: The signed-in candidate's profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CandidateProfile' }
        '404':
          description: NOT_FOUND, meaning no profile has been created yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    put:
      tags: [Profile]
      summary: Create or replace the profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateProfileInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CandidateProfile' }
        '422':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /profile/candidate/avatar:
    post:
      tags: [Profile]
      summary: Replace the profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CandidateProfile' }

  /profile/employer:
    get:
      tags: [Profile]
      summary: The signed-in employer's organisation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Organization' }
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    put:
      tags: [Profile]
      summary: Create or replace the organisation
      description: >
        An individual employer also gets an organisation, so ownership follows
        one path regardless of account type.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Organization' }
        '422':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /cities:
    get:
      tags: [Catalog]
      summary: Active cities
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/City' }

  /cities/{city}/districts:
    get:
      tags: [Catalog]
      summary: Districts of a city
      security: []
      parameters:
        - name: city
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/District' }

  /categories:
    get:
      tags: [Catalog]
      summary: Job categories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }

  /catalog/job-form:
    get:
      tags: [Catalog]
      summary: Reference taxonomies for the publish form
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobFormOptions' }

  /jobs:
    get:
      tags: [Jobs]
      summary: Browse published listings
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: Category code }
        - { name: work_type, in: query, schema: { type: string }, description: Work-type code }
        - { name: city, in: query, schema: { type: integer } }
        - { name: salary_min, in: query, schema: { type: number } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JobCard' }
                      meta: { $ref: '#/components/schemas/Pagination' }

  /jobs/{slug}:
    get:
      tags: [Jobs]
      summary: Open a listing by slug
      description: >-
        Returns an active listing to anyone. A paused listing is still returned
        via its direct link (D-12) with `is_open_for_applications: false`;
        listings in any other status return 404.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobDetail' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /employer/jobs:
    get:
      tags: [Employer]
      summary: The employer's own listings, any status
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JobCard' }
                      meta: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Employer]
      summary: Publish a listing
      description: >-
        Goes live at once for a verified or previously-approved organization,
        else enters `pending_review` (D-15).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobDetail' }
        '403':
          description: Employer has no organization (ORGANIZATION_MISSING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /employer/jobs/{uuid}:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Employer]
      summary: Show one of the employer's listings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobDetail' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    put:
      tags: [Employer]
      summary: Edit a listing
      description: >-
        Allowed until the listing is terminally closed. A material change to a
        listing that already has applicants records a revision and notifies each
        applicant (D-14).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobDetail' }
        '422':
          description: Not editable (JOB_NOT_EDITABLE) or validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /employer/jobs/{uuid}/pause:
    post:
      tags: [Employer]
      summary: Pause an active listing
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobDetail' }
        '422':
          description: Illegal transition (JOB_INVALID_TRANSITION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /employer/jobs/{uuid}/resume:
    post:
      tags: [Employer]
      summary: Resume a paused listing
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobDetail' }

  /employer/jobs/{uuid}/fill:
    post:
      tags: [Employer]
      summary: Mark a listing as filled
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobDetail' }

  /employer/jobs/{uuid}/close:
    post:
      tags: [Employer]
      summary: Close a listing
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobDetail' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: [string, 'null'] }
        data: {}
        meta:
          type: object
          properties:
            pagination: { $ref: '#/components/schemas/Pagination' }

    ErrorEnvelope:
      type: object
      required: [success, message, error]
      properties:
        success: { type: boolean, const: false }
        message:
          type: string
          description: Arabic copy, ready to display. Never branch on this.
        error:
          type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            details:
              type: object
              description: >
                Field errors for VALIDATION_FAILED, or extra context such as
                retry_after_seconds.
            trace_id: { type: [string, 'null'] }

    ErrorCode:
      type: string
      description: Stable identifier. This is the contract, not the message.
      enum:
        - UNKNOWN_ERROR
        - VALIDATION_FAILED
        - NOT_FOUND
        - FORBIDDEN
        - RATE_LIMITED
        - SESSION_EXPIRED
        - FORCE_UPDATE
        - MAINTENANCE_MODE
        - ACCOUNT_SUSPENDED
        - PHONE_INVALID
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_MAX_ATTEMPTS
        - OTP_RESEND_COOLDOWN
        - JOB_NOT_ACTIVE
        - JOB_NOT_EDITABLE
        - JOB_INVALID_TRANSITION
        - APPLICATION_ALREADY_EXISTS
        - APPLICATION_ALREADY_DECIDED
        - VACANCIES_EXHAUSTED
        - SUBSCRIPTION_REQUIRED
        - ORGANIZATION_NOT_VERIFIED
        - ORGANIZATION_MISSING
        - CONVERSATION_NOT_ALLOWED

    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: [integer, 'null'] }
        last_page: { type: [integer, 'null'] }
        has_more: { type: boolean }

    UserRole:
      type: string
      enum: [candidate, employer]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, examples: ['0512345678'] }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { type: string, enum: [active, suspended, deleted] }
        phone_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    CandidateProfile:
      type: object
      properties:
        full_name: { type: string }
        age:
          type: [integer, 'null']
          description: Derived from the birth date; never stored.
        birth_date: { type: [string, 'null'], format: date }
        nationality_code: { type: [string, 'null'] }
        city: { $ref: '#/components/schemas/CityRef' }
        job_title: { type: [string, 'null'] }
        years_of_experience: { type: [integer, 'null'] }
        skills:
          type: array
          items: { type: string }
        bio: { type: [string, 'null'] }
        completion_percentage: { type: integer, minimum: 0, maximum: 100 }
        avatar_url: { type: [string, 'null'] }

    CandidateProfileInput:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string, minLength: 3, maxLength: 120 }
        national_id:
          type: string
          description: Encrypted at rest and never returned.
        national_id_type: { type: string, enum: [national, iqama] }
        birth_date: { type: string, format: date }
        nationality_code: { type: string, minLength: 2, maxLength: 2 }
        city_id: { type: integer }
        job_title: { type: string, maxLength: 120 }
        years_of_experience: { type: integer, minimum: 0, maximum: 60 }
        skills:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
        bio: { type: string, maxLength: 1000 }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [individual, company] }
        name: { type: string }
        slug: { type: string }
        responsible_person_name: { type: [string, 'null'] }
        city: { $ref: '#/components/schemas/CityRef' }
        about: { type: [string, 'null'] }
        verification_status:
          type: string
          enum: [unverified, pending, verified, rejected]
        is_verified: { type: boolean }
        logo_url: { type: [string, 'null'] }

    OrganizationInput:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [individual, company] }
        name: { type: string, minLength: 2, maxLength: 160 }
        responsible_person_name: { type: string, maxLength: 120 }
        commercial_registration:
          type: string
          description: Required for a company. Encrypted at rest, never returned.
        city_id: { type: integer }
        about: { type: string, maxLength: 2000 }

    CityRef:
      type: [object, 'null']
      properties:
        id: { type: integer }
        name: { type: string }

    City:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string, examples: ['الرياض'] }
        region: { type: [string, 'null'] }

    District:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string, examples: ['حي العليا'] }

    Category:
      type: object
      properties:
        code:
          type: string
          enum:
            - restaurants
            - cleaning
            - logistics
            - events
            - retail
            - security
            - operations
            - crafts
            - seasonal_work
            - other
        name: { type: string, examples: ['مطاعم ومقاهي'] }
        icon: { type: string }
        color_token: { type: string }

    ReferenceOption:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }

    JobFormOptions:
      type: object
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        work_types:
          type: array
          items: { $ref: '#/components/schemas/ReferenceOption' }
        salary_units:
          type: array
          items: { $ref: '#/components/schemas/ReferenceOption' }
        gender_requirements:
          type: array
          items: { $ref: '#/components/schemas/ReferenceOption' }
        nationality_requirements:
          type: array
          items: { $ref: '#/components/schemas/ReferenceOption' }

    JobStatus:
      type: string
      enum: [draft, pending_review, active, paused, filled, expired, closed, rejected, removed]

    ContactChannel:
      type: string
      enum: [app, whatsapp, both]

    Salary:
      type: object
      properties:
        amount: { type: number }
        amount_max: { type: [number, 'null'] }
        currency: { type: string, examples: ['SAR'] }
        formatted: { type: string, examples: ['4,500 – 6,000'] }
        unit: { type: string, examples: ['شهرياً'] }

    JobCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        salary: { $ref: '#/components/schemas/Salary' }
        category: { $ref: '#/components/schemas/Category' }
        work_type: { type: string }
        city: { type: string }
        district: { type: [string, 'null'] }
        organization:
          type: object
          properties:
            name: { type: string }
            is_verified: { type: boolean }
        status: { $ref: '#/components/schemas/JobStatus' }
        contact_channel: { $ref: '#/components/schemas/ContactChannel' }
        published_at: { type: [string, 'null'], format: date-time }
        applications_count:
          type: integer
          description: Present only on the employer's own list.

    JobDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        salary: { $ref: '#/components/schemas/Salary' }
        category: { $ref: '#/components/schemas/Category' }
        work_type: { type: string }
        hours_per_week: { type: [integer, 'null'] }
        shift_note: { type: [string, 'null'] }
        vacancies_count: { type: integer }
        requirements:
          type: object
          properties:
            gender: { type: string }
            nationality: { type: string }
        location:
          type: object
          properties:
            city: { type: string }
            district: { type: [string, 'null'] }
            address_line: { type: [string, 'null'] }
        organization:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            is_verified: { type: boolean }
        status: { $ref: '#/components/schemas/JobStatus' }
        status_label: { type: string }
        is_open_for_applications: { type: boolean }
        contact_channel: { $ref: '#/components/schemas/ContactChannel' }
        published_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

    JobInput:
      type: object
      required:
        - title
        - category_id
        - work_type_id
        - salary_unit_id
        - gender_requirement_id
        - nationality_requirement_id
        - salary_amount
        - vacancies_count
        - city_id
        - contact_channel
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        category_id: { type: integer }
        work_type_id: { type: integer }
        salary_unit_id: { type: integer }
        gender_requirement_id: { type: integer }
        nationality_requirement_id: { type: integer }
        salary_amount: { type: number, minimum: 0 }
        salary_amount_max: { type: number, description: Must be >= salary_amount }
        hours_per_week: { type: integer, minimum: 1, maximum: 168 }
        shift_note: { type: string, maxLength: 160 }
        vacancies_count: { type: integer, minimum: 1, maximum: 999 }
        city_id: { type: integer }
        district_id: { type: integer, description: Must belong to city_id }
        address_line: { type: string, maxLength: 255 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        contact_channel: { $ref: '#/components/schemas/ContactChannel' }
        expires_at: { type: string, format: date-time }

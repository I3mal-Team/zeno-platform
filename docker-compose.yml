name: zeno

services:
  # ── التطبيق (PHP-FPM) ────────────────────────────
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-501}
        GID: ${GID:-20}
    container_name: zeno-app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www:cached
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    networks: [zeno]

  # ── الخادم ───────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: zeno-nginx
    ports: ["${APP_PORT:-8000}:80"]
    volumes:
      - ./backend:/var/www:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [zeno]

  # ── قاعدة البيانات: PostGIS إلزامي (§0.2) ────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: zeno-postgres
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-zeno}
      POSTGRES_USER:     ${DB_USERNAME:-zeno}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # ترتيب مناسب للنصوص العربية
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zeno} -d ${DB_DATABASE:-zeno}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [zeno]

  # ── الكاش والطوابير ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zeno-redis
    command: redis-server --appendonly yes
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    networks: [zeno]

  # ── البحث العربي (§2.2) ──────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: zeno-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKeyForLocalDevOnly}
      MEILI_ENV: development
    ports: ["${MEILI_PORT:-7700}:7700"]
    volumes: [meilidata:/meili_data]
    networks: [zeno]

  # ── معالج الطوابير ───────────────────────────────
  horizon:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-501}
        GID: ${GID:-20}
    container_name: zeno-horizon
    working_dir: /var/www
    command: php artisan horizon
    volumes: [./backend:/var/www:cached]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    restart: unless-stopped
    networks: [zeno]

  # ── WebSocket للمحادثات (§2.2) ───────────────────
  reverb:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-501}
        GID: ${GID:-20}
    container_name: zeno-reverb
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["${REVERB_PORT:-8080}:8080"]
    volumes: [./backend:/var/www:cached]
    depends_on: [redis]
    restart: unless-stopped
    networks: [zeno]

  # ── بريد التطوير ─────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: zeno-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # الواجهة
      - "${MAILPIT_SMTP_PORT:-51025}:1025"   # SMTP
    networks: [zeno]

networks:
  zeno:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  meilidata:

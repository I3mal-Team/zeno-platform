<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://iconsax.gitlab.io/i/icons.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{font-family:'Tajawal',sans-serif;background:#FAF8F3;color:#2B2724}
  .iconsax{display:inline-flex;align-items:center;justify-content:center;line-height:1;font-style:normal;direction:ltr}
  a{text-decoration:none;color:inherit}
  .lnk{transition:color .18s ease}.lnk:hover{color:#2B2724}
  .btn{transition:transform .14s ease,box-shadow .24s ease,background .2s ease}
  .btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
  .toc{transition:background .16s ease,color .16s ease}
  .toc:hover{background:#F3F1EA;color:#2B2724}
</style>
</helmet>

<div style="direction:rtl;overflow-x:hidden;background:#FAF8F3;min-height:100vh">

  <!-- HEADER -->
  <header style="position:sticky;top:0;z-index:60;background:rgba(250,248,243,.85);backdrop-filter:blur(14px);border-bottom:1px solid #EEEBE3">
    <div style="max-width:1080px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px">
      <a href="Zeno-Landing.dc.html" style="display:flex;align-items:center"><img src="assets/zeno-logo.png" alt="zeno" style="height:32px;width:auto"></a>
      <nav style="display:flex;align-items:center;gap:28px;font-size:15px;font-weight:700;color:#6C665C">
        <a href="Zeno-Landing.dc.html" class="lnk">الرئيسية</a>
        <a href="Zeno-Jobs.dc.html" class="lnk">الوظائف</a>
        <a href="Zeno-About.dc.html" class="lnk">من نحن</a>
        <a href="Zeno-Contact.dc.html" class="lnk">تواصل معنا</a>
      </nav>
      <a href="Zeno-Landing.dc.html#download" class="btn" style="background:#2B2724;color:#fff;font-size:14.5px;font-weight:800;padding:11px 20px;border-radius:13px">حمّل التطبيق</a>
    </div>
  </header>

  <!-- HERO -->
  <section style="max-width:1080px;margin:0 auto;padding:44px 26px 10px">
    <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#8A857A"><a href="Zeno-Landing.dc.html" class="lnk">الرئيسية</a><i class="iconsax" style="font-size:15px" icon-name="chevron-left"></i><span style="color:#2B2724">الشروط والخصوصية</span></div>
    <h1 style="font-size:42px;font-weight:900;color:#211F20;margin-top:16px;letter-spacing:-.01em">الشروط والخصوصية</h1>
    <div style="font-size:14.5px;color:#8A857A;font-weight:600;margin-top:8px">آخر تحديث: 1 يوليو 2026</div>
  </section>

  <div style="max-width:1080px;margin:0 auto;padding:24px 26px 60px;display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start">

    <!-- TOC -->
    <aside style="position:sticky;top:88px;background:#fff;border:1px solid #EFEDE6;border-radius:18px;padding:14px">
      <div style="font-size:12.5px;font-weight:800;color:#8A857A;letter-spacing:.04em;padding:6px 10px 10px">المحتويات</div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ toc }}" as="t" hint-placeholder-count="6">
          <a href="{{ t.href }}" class="toc" style="display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:700;color:#6C665C"><span style="width:22px;height:22px;border-radius:7px;background:#F3F1EA;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#8A6D12;flex:0 0 auto">{{ t.n }}</span>{{ t.t }}</a>
        </sc-for>
      </div>
    </aside>

    <!-- CONTENT -->
    <div style="background:#fff;border:1px solid #EFEDE6;border-radius:22px;padding:38px 40px">
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="6">
        <div id="{{ s.id }}" style="scroll-margin-top:90px;padding-top:{{ s.pt }}">
          <div style="display:flex;align-items:center;gap:12px"><div style="width:38px;height:38px;border-radius:11px;background:#FDF1CC;display:flex;align-items:center;justify-content:center;color:#8A6D12;flex:0 0 auto;font-size:15px;font-weight:900">{{ s.n }}</div><h2 style="font-size:22px;font-weight:900;color:#211F20">{{ s.t }}</h2></div>
          <div style="margin-top:14px;display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{ s.paras }}" as="p" hint-placeholder-count="2">
              <p style="font-size:15.5px;color:#5A554C;font-weight:500;line-height:1.9">{{ p }}</p>
            </sc-for>
          </div>
          <sc-if value="{{ s.hasList }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
              <sc-for list="{{ s.list }}" as="li" hint-placeholder-count="3">
                <div style="display:flex;align-items:flex-start;gap:11px"><span style="width:24px;height:24px;border-radius:8px;background:#E7F4EC;display:flex;align-items:center;justify-content:center;color:#1F8A4D;flex:0 0 auto;margin-top:1px"><i class="iconsax" style="font-size:14px" icon-name="tick-circle"></i></span><span style="font-size:15px;color:#3F3A33;font-weight:600;line-height:1.6">{{ li }}</span></div>
              </sc-for>
            </div>
          </sc-if>
          <div style="height:1px;background:#F2F0E9;margin-top:26px"></div>
        </div>
      </sc-for>

      <div style="background:#F7F5EF;border-radius:16px;padding:22px;margin-top:26px;display:flex;align-items:center;gap:15px">
        <div style="width:46px;height:46px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;color:#8A6D12;flex:0 0 auto"><i class="iconsax" style="font-size:23px" icon-name="info-circle"></i></div>
        <div style="flex:1"><div style="font-size:15.5px;font-weight:800;color:#2B2724">لديك سؤال عن سياساتنا؟</div><div style="font-size:13.5px;color:#8A857A;font-weight:600;margin-top:2px">فريق الدعم جاهز لمساعدتك.</div></div>
        <a href="Zeno-Contact.dc.html" class="btn" style="background:#2B2724;color:#fff;font-size:14px;font-weight:800;padding:11px 20px;border-radius:12px">تواصل معنا</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer style="background:#26221F;color:#C7C2B8">
    <div style="max-width:1080px;margin:0 auto;padding:40px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
      <img src="assets/zeno-logo.png" alt="zeno" style="height:30px;width:auto;filter:brightness(0) invert(1)">
      <div style="display:flex;gap:26px;font-size:14.5px;font-weight:700"><a href="Zeno-Landing.dc.html" class="lnk" style="color:#B7B1A6">الرئيسية</a><a href="Zeno-About.dc.html" class="lnk" style="color:#B7B1A6">من نحن</a><a href="Zeno-Contact.dc.html" class="lnk" style="color:#B7B1A6">تواصل</a></div>
      <div style="font-size:13.5px;color:#8A857A;font-weight:600">© 2026 زينو</div>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const sections=[
      {id:'intro', n:'1', t:'مقدّمة', paras:[
        'باستخدامك تطبيق ومنصة زينو، فإنك توافق على هذه الشروط وسياسة الخصوصية. يُرجى قراءتها بعناية قبل استخدام الخدمة.',
        'زينو منصة توظيف محلي تربط الباحثين عن عمل بالمنشآت القريبة. نحتفظ بحق تحديث هذه الشروط، وسنُعلمك بأي تغييرات جوهرية.',
      ]},
      {id:'accounts', n:'2', t:'الحسابات والاستخدام', paras:[
        'يجب أن تكون بعمر 18 عامًا فأكثر لإنشاء حساب. أنت مسؤول عن دقة بياناتك وسرية رقم جوالك ورمز التحقق.',
      ], hasList:true, list:[
        'تقديم معلومات صحيحة وحديثة في ملفك الشخصي.',
        'عدم انتحال هوية شخص أو منشأة أخرى.',
        'الالتزام بالتواصل المهني والمحترم مع الطرف الآخر.',
      ]},
      {id:'employers', n:'3', t:'التزامات أصحاب العمل', paras:[
        'يتعهد أصحاب العمل بنشر وظائف حقيقية وشروط واضحة، وعدم طلب أي رسوم من المتقدّمين. الوظائف المخالفة تُحذف وقد يُوقف الحساب.',
      ]},
      {id:'privacy', n:'4', t:'الخصوصية والبيانات', paras:[
        'نجمع البيانات اللازمة لتشغيل الخدمة: رقم الجوال، بيانات الملف المهني، والموقع التقريبي لعرض الوظائف القريبة. لا نبيع بياناتك لأطراف ثالثة.',
      ], hasList:true, list:[
        'نستخدم موقعك فقط لعرض الفرص القريبة، ويمكنك إيقافه في أي وقت.',
        'تُشارك بياناتك مع صاحب العمل فقط عند تقديمك على وظيفته.',
        'يمكنك طلب حذف حسابك وبياناتك بالكامل عبر الدعم.',
      ]},
      {id:'comm', n:'5', t:'التواصل عبر واتساب', paras:[
        'عند اختيارك التواصل عبر واتساب، يتم فتح المحادثة برسالة جاهزة تتضمّن بياناتك ورقم طلبك. أنت من يتحكم بإرسالها، وتخضع بعدها لسياسة واتساب.',
      ]},
      {id:'liability', n:'6', t:'حدود المسؤولية', paras:[
        'زينو وسيط يربط الطرفين ولا يكون طرفًا في عقد العمل. لا نضمن التوظيف أو دقة كل إعلان، وننصح بالتحقق قبل أي التزام. استمرار استخدامك يعني موافقتك على هذه الشروط.',
      ]},
    ].map((s,i)=>({ ...s, pt: i===0?'0':'26px', hasList: !!s.hasList, list: s.list||[] }));

    return {
      sections,
      toc: sections.map(s=>({ n:s.n, t:s.t, href:'#'+s.id })),
    };
  }
}
</script>
</body>
</html>
